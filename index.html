<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieClick</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://p16-pu-sign-useast8.tiktokcdn-us.com/tos-useast5-avt-0068-tx/3afdf3da9ccd5f6f875dd1da03760d4a~c5_1080x1080.jpeg?lk3s=a5d48078&nonce=28864&refresh_token=0b7f7d0c0bcf4727bf33890183f22df0&x-expires=1736308800&x-signature=PeX6QVsZMprLJFIssnOKR2F0P0E%3D&shp=a5d48078&shcp=81f88b70" type="image/x-icon">
    <style>
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .custom-iframe {
            border: 2px solid #4A5568;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            object-fit: cover;
            opacity: 0.5;
        }

        .background-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), rgba(0, 0, 255, 0.7));
            z-index: -1;
        }

        .text-stroke {
            -webkit-text-stroke: 1px black;
        }

        /* Button Styles */
        .bg-gradient-to-r {
            transition: background-position 0.3s ease-in-out;
        }

        .bg-gradient-to-r:hover {
            background-position: 100% 0;
        }

        /* Episode List Styles */
        #episodeList .bg-white {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        #episodeList .bg-white:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-gray-100 font-roboto relative">
    <img src="https://mlpnk72yciwc.i.optimole.com/cqhiHLc.IIZS~2ef73/w:auto/h:auto/q:75/https://bleedingcool.com/wp-content/uploads/2024/12/ROO_S7_KA_1080x1350_v1-1_PRE.jpg" alt="Background image of a movie poster with dramatic lighting and characters" class="background-image">
    <div class="background-gradient"></div>
    <div class="container mx-auto p-4 relative z-10">
        <div class="text-center mb-6">
            <img src="https://p16-pu-sign-useast8.tiktokcdn-us.com/tos-useast5-avt-0068-tx/3afdf3da9ccd5f6f875dd1da03760d4a~c5_1080x1080.jpeg?lk3s=a5d48078&nonce=28864&refresh_token=0b7f7d0c0bcf4727bf33890183f22df0&x-expires=1736308800&x-signature=PeX6QVsZMprLJFIssnOKR2F0P0E%3D&shp=a5d48078&shcp=81f88b70" alt="MovieClick Logo" class="mx-auto w-24 h-24 rounded-full">
            <h1 class="text-4xl font-bold mt-4 text-white text-stroke">MovieClick</h1>
        </div>
        <div class="flex justify-center mb-6">
            <iframe id="videoFrame" class="w-full h-64 md:h-96 lg:h-128 custom-iframe fade-in" src="https://drive.google.com/file/d/1RhQ1NvzIqC7Vkjf2RLMXoCSme3ZtIU0l/preview" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="flex justify-center space-x-4">
            <button id="season6Btn" class="bg-gradient-to-r from-blue-500 to-blue-700 text-white px-4 py-2 rounded-full hover:from-blue-700 hover:to-blue-900 transition duration-300">Season 6</button>
            <button id="season7Btn" class="bg-gradient-to-r from-blue-500 to-blue-700 text-white px-4 py-2 rounded-full hover:from-blue-700 hover:to-blue-900 transition duration-300">Season 7</button>
        </div>
        <div id="episodeList" class="mt-6 space-y-2">
            <!-- Episodes will be dynamically inserted here -->
        </div>
    </div>

    <script>
        const season6Episodes = [
            { title: "Season 6 Episode 1", url: "https://drive.google.com/file/d/1RhQ1NvzIqC7Vkjf2RLMXoCSme3ZtIU0l/preview" },
            { title: "Season 6 Episode 2", url: "https://drive.google.com/file/d/1GjVXo0OUoEAPPtaiwWjr8n8eRZlzPRPH/preview" },
            { title: "Season 6 Episode 3", url: "https://drive.google.com/file/d/1WNOX4EHUzsVQsWKjZreLa9dA6vZhKN25/preview" },
            { title: "Season 6 Episode 4", url: "https://drive.google.com/file/d/12UXL8cLRLJyHI0heGa1DnrqjAEVmtYHq/preview" },
            { title: "Season 6 Episode 5", url: "https://drive.google.com/file/d/1bD-m_RXtP4P2dmjnCEXoWaMLeOp8wRWe/preview" },
            { title: "Season 6 Episode 6", url: "https://drive.google.com/file/d/1rxO30b_T83moMCQrfL3D-G7CVgUVulyT/preview" },
            { title: "Season 6 Episode 7", url: "https://drive.google.com/file/d/1BQ-GJtfcvW4Un5f4ZS7aHDr-69VuKXtL/preview" },
            { title: "Season 6 Episode 8", url: "https://drive.google.com/file/d/19nxnPhU-n6Qb70ZMjSGlq4HzzDb-D2oH/preview" },
            { title: "Season 6 Episode 9", url: "https://drive.google.com/file/d/159h-xMj5QZv8edO9i4FDyThkkExUo2lC/preview" },
            { title: "Season 6 Episode 10", url: "https://drive.google.com/file/d/1EvO94aS2g-bzoHyOmG3JXMLgP-RSIAE7/preview" }
        ];

        const season7Episodes = [
            { title: "Season 7 Episode 1", url: "#" },
            { title: "Season 7 Episode 2", url: "#" },
            { title: "Season 7 Episode 3", url: "#" },
            { title: "Season 7 Episode 4", url: "#" },
            { title: "Season 7 Episode 5", url: "#" },
            { title: "Season 7 Episode 6", url: "#" },
            { title: "Season 7 Episode 7", url: "#" },
            { title: "Season 7 Episode 8", url: "#" },
            { title: "Season 7 Episode 9", url: "#" },
            { title: "Season 7 Episode 10", url: "#" },
            { title: "Season 7 Episode 11", url: "#" },
            { title: "Season 7 Episode 12", url: "#" },
            { title: "Season 7 Episode 13", url: "#" },
            { title: "Season 7 Episode 14", url: "#" },
            { title: "Season 7 Episode 15", url: "#" },
            { title: "Season 7 Episode 16", url: "#" },
            { title: "Season 7 Episode 17", url: "#" },
            { title: "Season 7 Episode 18", url: "#" }
        ];

        document.getElementById('season6Btn').addEventListener('click', () => {
            loadEpisodes(season6Episodes);
        });

        document.getElementById('season7Btn').addEventListener('click', () => {
            loadEpisodes(season7Episodes, true);
        });

        function loadEpisodes(episodes, isSeason7 = false) {
            const episodeList = document.getElementById('episodeList');
            episodeList.innerHTML = '';
            episodes.forEach(episode => {
                const episodeItem = document.createElement('div');
                episodeItem.className = 'bg-white p-4 rounded shadow hover:bg-gray-100 cursor-pointer transition duration-300';
                episodeItem.innerText = episode.title;
                episodeItem.addEventListener('click', () => {
                    if (isSeason7) {
                        alert("Season 7 isn't out yet! It premieres on Tuesday, January 7, 2025, at 10 pm ET on ABC");
                    } else {
                        document.getElementById('videoFrame').src = episode.url;
                    }
                });
                episodeList.appendChild(episodeItem);
            });
        }

        // Load Season 6 episodes by default
        loadEpisodes(season6Episodes);
    </script>
</body>
</html>
